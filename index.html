
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffb2c0">
    <title>Do You Love Me? 💗</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <section class="card" aria-labelledby="questionTitle">
            <h1 id="questionTitle">Do you love me?</h1>

            <div class="character" role="img" aria-label="A cute character holding a heart">
                <span class="flower" aria-hidden="true">✿</span>

                <div class="character-head">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="blush blush-left"></span>
                    <span class="blush blush-right"></span>
                    <span class="mouth">ᴗ</span>
                </div>

                <div class="character-body">
                    <span class="body-heart" aria-hidden="true">♥</span>
                </div>

                <span class="arm arm-left"></span>
                <span class="arm arm-right"></span>
            </div>

            <p id="message" aria-live="polite">Please choose wisely! 💗</p>

            <div class="buttons">
                <button id="yesBtn" class="yes-btn" type="button">
                    YES 💗
                </button>

                <button id="noBtn" class="no-btn" type="button">
                    NO 😢
                </button>
            </div>
        </section>
    </main>

    <section id="finalScreen" class="final-screen"
             aria-labelledby="finalTitle" aria-hidden="true" inert>
        <div class="final-content">
            <h2 id="finalTitle">
                I knew it! <span class="outlined-heart" aria-hidden="true">♥</span>
            </h2>

            <div class="character final-character"
                 role="img" aria-label="A cute character holding a heart">
                <span class="flower" aria-hidden="true">✿</span>

                <div class="character-head">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="blush blush-left"></span>
                    <span class="blush blush-right"></span>
                    <span class="mouth">ᴗ</span>
                </div>

                <div class="character-body">
                    <span class="body-heart" aria-hidden="true">♥</span>
                </div>

                <span class="arm arm-left"></span>
                <span class="arm arm-right"></span>
            </div>

            <p class="anniversary">
                HAPPY 4TH MONTHSARRY BAMM!!
                <span class="outlined-heart" aria-hidden="true">♥</span>
            </p>

            <p class="love-note">I love you so much! 💕</p>
        </div>
    </section>
</body>
</html>
